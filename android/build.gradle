buildscript {
    ext.kotlin_version = '1.9.10'  // 최신 Kotlin 버전
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // classpath "com.google.gms:google-services:4.3.15"  // 반드시 버전 명시
    }
}
plugins {
    id "com.android.application" version "8.1.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false // 플러그인 버전 명시
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// rootProject.buildDir = '../build'
// subprojects {
//     project.buildDir = "${rootProject.buildDir}/${project.name}"
// }
subprojects {
    project.evaluationDependsOn(':app')
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

configurations.all {
    resolutionStrategy {
        // 강제로 특정 버전 사용
        force 'androidx.annotation:annotation:1.7.1'
        force 'androidx.core:core:1.9.0'
        force 'androidx.lifecycle:lifecycle-livedata:2.3.1'
        force 'androidx.lifecycle:lifecycle-runtime:2.3.1'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.3.1'
    }
}