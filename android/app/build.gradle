plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'


android {
    namespace "com.example.getlery_client"
    compileSdkVersion 34  // compileSdk를 명확히 지정
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // sourceSets {
    //     main.java.srcDirs += 'src/main/kotlin'
    // }

    defaultConfig {
        applicationId "com.example.getlery_client"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
    lintOptions {
    baseline file("lint-baseline.xml")  // 기본 설정 파일로 사용할 lint-baseline.xml 지정
    abortOnError false  // 모든 lint 오류에 대해 빌드를 멈추지 않도록 설정
    disable 'NewApi', 'MissingTranslation', 'UnusedResources', 'ScopedStorage'  // NewApi 오류 무시
    checkReleaseBuilds false  // 릴리즈 빌드 시 lint 검사를 하지 않음
    }
// buildFeatures를 추가해 주는 부분
    buildFeatures {
        buildConfig true  // buildConfig 사용 활성화
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-analytics"
}
